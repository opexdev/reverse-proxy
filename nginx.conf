worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    include /etc/nginx/mime.types;
    sendfile on;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout   70;
    keepalive_requests 100;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    ssl_certificate     /run/secrets/opex_dev_crt;
    ssl_certificate_key /run/secrets/private_pem;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;

    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Headers * always;
    add_header Access-Control-Allow-Methods 'POST, PUT, PATCH, GET, DELETE, OPTIONS, HEAD' always;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $server_name;
    proxy_set_header   X-Forwarded-Port $EXPOSED_PORT;

    resolver 127.0.0.11 valid=60s;

    map $http_user_agent $is_mobile {
           default                 0;
           ~*iphone                1;
           ~*ipod                  1;
           ~*android               1;
           ~*blackberry            1;
           ~*windows\ phone        1;
           mobile                  1;
           opera\ mini             1;
           iemobile                1;
    }

    # Set root path based on device type
    map $is_mobile $web_app_root {
        0  /var/www/desktop;
        1  /var/www/mobile;
    }

    server {
        listen 80;

        location /metrics {
            stub_status on;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_WALLET_STAT;

        location / {
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods 'POST, PUT, PATCH, GET, DELETE, OPTIONS, HEAD' always;
            set $backend http://37.27.33.143:8080;
            proxy_pass $backend;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_KIBANA;

        location / {
            set $backend http://kibana:5601;
            proxy_pass $backend;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_GRAFANA;

        location / {
            set $backend http://grafana:3000;
            proxy_pass $backend;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_ADMIN_PANEL;

        location ~* \.(.*)$ {
            set $backend http://admin-panel;
            proxy_pass $backend;
        }

        location / {
            set $backend http://admin-panel;
            proxy_pass $backend;
            rewrite .* / break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_ADMIN_V2_PANEL;

        location ~* \.(.*)$ {
            set $backend http://admin-v2-panel-nginx;
            proxy_pass $backend;
        }

        location / {
            set $backend http://admin-v2-panel-nginx;
            proxy_pass $backend;
            rewrite .* / break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_WEB_APP;

        location ~* \.(.*)$ {
            set $backend http://web-app;
            proxy_pass $backend;
        }

        location / {
            set $backend http://web-app;
            proxy_pass $backend;
            rewrite .* / break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_MOBILE_APP;

        location ~* \.(.*)$ {
            set $backend http://mobile-app;
            proxy_pass $backend;
        }

        location / {
            set $backend http://mobile-app;
            proxy_pass $backend;
            rewrite .* / break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_AUTH;

        location / {
            set $backend http://auth:8080;
            proxy_pass $backend;
            rewrite ^/(.*)$ /auth/$1 break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_KC;

        location / {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://keycloak:8080;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_V2_AUTH;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://auth-gateway:8080;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name v2api.opex.dev;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://api:8080;
            rewrite ^/(.*)$ /opex/$1 break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_HEALTH;

        location /accountant {
            set $backend http://accountant:8080;
            proxy_pass $backend;
            rewrite ^/accountant(.*)$ /actuator/health/$1 break;
        }

        location /api {
            set $backend http://api:8080;
            proxy_pass $backend;
            rewrite ^/api(.*)$ /actuator/health/$1 break;
        }

        location /bc-gateway {
            set $backend http://bc-gateway:8080;
            proxy_pass $backend;
            rewrite ^/bc-gateway(.*)$ /actuator/health/$1 break;
        }

        location /captcha {
            set $backend http://captcha:8080;
            proxy_pass $backend;
            rewrite ^/captcha(.*)$ /actuator/health/$1 break;
        }

        location /eventlog {
            set $backend http://eventlog:8080;
            proxy_pass $backend;
            rewrite ^/eventlog(.*)$ /actuator/health/$1 break;
        }

        location /market {
            set $backend http://market:8080;
            proxy_pass $backend;
            rewrite ^/market(.*)$ /actuator/health/$1 break;
        }

        location /matching-engine {
            set $backend http://matching-engine:8080;
            proxy_pass $backend;
            rewrite ^/matching-engine(.*)$ /actuator/health/$1 break;
        }

        location /matching-gateway {
            set $backend http://matching-gateway:8080;
            proxy_pass $backend;
            rewrite ^/matching-gateway(.*)$ /actuator/health/$1 break;
        }

        location /referral {
            set $backend http://referral:8080;
            proxy_pass $backend;
            rewrite ^/referral(.*)$ /actuator/health/$1 break;
        }

        location /auth {
            set $backend http://auth:8080;
            proxy_pass $backend;
            rewrite ^/auth(.*)$ /actuator/health/$1 break;
        }
        location /auth-gateway {
            set $backend http://auth-gateway:8080;
            proxy_pass $backend;
            rewrite ^/auth-gateway(.*)$ /actuator/health/$1 break;
        }

        location /wallet {
            set $backend http://wallet:8080;
            proxy_pass $backend;
            rewrite ^/wallet(.*)$ /actuator/health/$1 break;
        }

        location /websocket {
            set $backend http://websocket:8080;
            proxy_pass $backend;
            rewrite ^/websocket(.*)$ /actuator/health/$1 break;
        }

        location /config {
            set $backend http://config:8080;
            proxy_pass $backend;
            rewrite ^/config(.*)$ /actuator/health/$1 break;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name $SERVER_NAME_API;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        include /etc/nginx/health-check.conf;

        location /wallet/transfer {
            return 403;
        }

        location /wallet/deposit {
            return 403;
        }

        location /wallet/payment/internal {
            return 403;
        }

        location /auth {
            set $backend http://auth:8080;
            proxy_pass $backend;
        }

        location /wallet {
            set $backend http://wallet:8080;
            proxy_pass $backend;
            rewrite ^/wallet/(.*)$ /$1 break;
        }

        location /gateway {
            set $backend http://matching-gateway:8080;
            proxy_pass $backend;
            rewrite ^/gateway/(.*)$ /$1 break;
        }

        location /storage {
            set $backend http://storage:8080;
            proxy_pass $backend;
            rewrite ^/storage/(.*)$ /$1 break;
        }

        location /referral {
            set $backend http://referral:8080;
            proxy_pass $backend;
            rewrite ^/referral/(.*)$ /$1 break;
        }

        location /config {
            set $backend http://config:8080;
            proxy_pass $backend;
            rewrite ^/config/(.*)$ /$1 break;
        }

        location /market {
            set $backend http://market:8080;
            proxy_pass $backend;
            rewrite ^/market/(.*)$ /$1 break;
        }

        location /stream {
            # WS config
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection  "upgrade";
            ###########
            set $backend http://websocket:8080;
            proxy_pass $backend;
            rewrite ^/stream/(.*)$ /$1 break;
        }

        location /ipg {
            set $backend http://payment:8080;
            proxy_pass $backend;
            rewrite ^/ipg/(.*)$ /$1 break;
        }

        location /admin {
            set $backend http://admin:8080;
            proxy_pass $backend;
            rewrite ^/admin/(.*)$ /$1 break;
        }

        location /api {
            set $backend http://api:8080;
            proxy_pass $backend;
            rewrite ^/api/(.*)$ /$1 break;
        }
        
        location /profile {
            set $backend http://profile:8080;
            proxy_pass $backend;
            rewrite ^/profile/(.*)$ /$1 break;
        }

        location /sapi {
            set $backend http://api:8080;
            proxy_pass $backend;
            rewrite ^/sapi/(.*)$ /$1 break;
        }

         location /bc {
            set $backend http://bc-gateway:8080;
            proxy_pass $backend;
            rewrite ^/bc/(.*)$ /$1 break;
        }

        location /captcha {
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods 'POST, PUT, PATCH, GET, DELETE, OPTIONS, HEAD' always;
            add_header Access-Control-Expose-Headers 'Captcha-Session-Key, Captcha-Expire-Timestamp' always;
            set $backend http://captcha:8080;
            proxy_pass $backend;
            rewrite ^/captcha/(.*)$ /$1 break;
        }

      resolver 127.0.0.11 valid=30s;
      resolver_timeout 15s;


      location /binance {

          # target upstream (IMPORTANT: must be variable for DNS resolution)
          set $backend https://binance.beeep.ir;

          # route path
          rewrite ^/binance/(.*)$ /$1 break;

          # upstream connection settings
          proxy_pass $backend;

          # correct upstream identity
          proxy_set_header Host binance.beeep.ir;
          proxy_ssl_server_name on;
          proxy_ssl_name binance.beeep.ir;

          # client headers
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # timeouts (important for slow Binance-like APIs)
          proxy_connect_timeout 60s;
          proxy_send_timeout 300s;
          proxy_read_timeout 300s;
          send_timeout 300s;

          # retry logic (VERY IMPORTANT for your error)
          proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
          proxy_next_upstream_tries 3;
          proxy_next_upstream_timeout 60s;

          # TLS (since upstream is HTTPS)
          proxy_ssl_verify off;

          # avoid buffering issues for slow responses
          proxy_buffering off;
          proxy_request_buffering off;

          # stability
          proxy_intercept_errors off;
      }

    }


    server {
        listen 443 ssl http2;
        server_name $SERVER_NAME_BETA_APP;
        index index.html;

        # Redirect mobile users
        location / {
            if ($is_mobile) {
                rewrite ^ /mobile break;
            }

            root /var/www/desktop;
            try_files $uri $uri/ /index.html;
        }

        # Mobile app
        location /mobile/ {
            alias /var/www/mobile/;
            try_files $uri $uri/ /index.html;
        }

        # Static assets (shared logic)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Optional: silence favicon errors
        location = /favicon.ico {
            access_log off;
            log_not_found off;

            # Always serve from desktop (simplest + safest)
            root /var/www/desktop;

            try_files /favicon.ico =204;
        }
    }

}
